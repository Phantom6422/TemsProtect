        default: op
    coreprotect.lookup.item:
        description: Legacy alias for temsprotect.lookup.item
        default: op
    coreprotect.lookup.kill:
        description: Legacy alias for temsprotect.lookup.kill
        default: op
    coreprotect.lookup.spawn:
        description: Legacy alias for temsprotect.lookup.spawn
        default: op
    coreprotect.rollback:
        description: Legacy alias for temsprotect.rollback
        default: op
    coreprotect.restore:
        description: Legacy alias for temsprotect.restore
