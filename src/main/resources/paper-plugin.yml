name: TemsProtect
version: '${version}'
main: net.coreprotect.CoreProtect
loader: net.coreprotect.TemsProtectPluginLoader
api-version: '26.1'
description: >
             Fast block logging, rollback, restore and anti-griefing for Paper servers.
authors: [Phantom6422, Intelli]
website: https://github.com/Phantom6422/TemsProtect
load: POSTWORLD
dependencies:
  server:
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    FastAsyncWorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    AdvancedChests:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
    temsprotect.*:
        description: Gives access to all TemsProtect actions and commands
        default: op
        children:
            temsprotect.rollback: true
            temsprotect.restore: true
            temsprotect.inspect: true
            temsprotect.help: true
            temsprotect.purge: true
            temsprotect.lookup: true
            temsprotect.teleport: true
            temsprotect.reload: true
            temsprotect.status: true
            temsprotect.consumer: true
            temsprotect.networking: true
            temsprotect.migrate: true
            temsprotect.give: false
    temsprotect.co:
        description: Has permission to access the TemsProtect command
        default: true
    temsprotect.lookup:
        description: Has permission to use the lookup command
        default: op
        children:
            temsprotect.lookup.near: true
            temsprotect.lookup.chat: true
            temsprotect.lookup.command: true
            temsprotect.lookup.session: true
            temsprotect.lookup.username: true
            temsprotect.lookup.block: true
            temsprotect.lookup.sign: true
            temsprotect.lookup.click: true
            temsprotect.lookup.container: true
            temsprotect.lookup.inventory: true
            temsprotect.lookup.item: true
            temsprotect.lookup.kill: true
            temsprotect.lookup.spawn: true
            coreprotect.lookup: true
    temsprotect.lookup.near:
        description: Has permission to lookup nearby changes via the near command
        default: op
        children: { coreprotect.lookup.near: true }
    temsprotect.lookup.chat:
        description: Has permission to lookup chat messages
        default: op
        children: { coreprotect.lookup.chat: true }
    temsprotect.lookup.command:
        description: Has permission to lookup player commands
        default: op
        children: { coreprotect.lookup.command: true }
    temsprotect.lookup.session:
        description: Has permission to lookup player sessions
        default: op
        children: { coreprotect.lookup.session: true }
    temsprotect.lookup.username:
        description: Has permission to lookup player username changes
        default: op
        children: { coreprotect.lookup.username: true }
    temsprotect.lookup.block:
        description: Has permission to lookup block data
        default: op
        children: { coreprotect.lookup.block: true }
    temsprotect.lookup.sign:
        description: Has permission to lookup sign messages
        default: op
        children: { coreprotect.lookup.sign: true }
    temsprotect.lookup.click:
        description: Has permission to lookup player interactions
        default: op
        children: { coreprotect.lookup.click: true }
    temsprotect.lookup.container:
        description: Has permission to lookup container transactions
        default: op
        children: { coreprotect.lookup.container: true }
    temsprotect.lookup.inventory:
        description: Has permission to lookup inventory transactions
        default: op
        children: { coreprotect.lookup.inventory: true }
    temsprotect.lookup.item:
        description: Has permission to lookup item transactions
        default: op
        children: { coreprotect.lookup.item: true }
    temsprotect.lookup.kill:
        description: Has permission to lookup entity kills
        default: op
        children: { coreprotect.lookup.kill: true }
    temsprotect.lookup.spawn:
        description: Has permission to lookup entity spawns
        default: op
        children: { coreprotect.lookup.spawn: true }
    temsprotect.rollback:
        description: Has permission to perform rollbacks
        default: op
        children: { coreprotect.rollback: true }
    temsprotect.restore:
        description: Has permission to perform restores
        default: op
        children: { coreprotect.restore: true }
    temsprotect.inspect:
        description: Has permission to use the inspector
        default: op
        children: { coreprotect.inspect: true }
    temsprotect.help:
        description: Has permission to use the help command
        default: op
        children: { coreprotect.help: true }
    temsprotect.purge:
        description: Has permission to use the purge command
        default: op
        children: { coreprotect.purge: true }
    temsprotect.teleport:
        description: Has permission to use the teleport command
        default: op
        children: { coreprotect.teleport: true }
    temsprotect.reload:
        description: Has permission to use the reload command
        default: op
        children: { coreprotect.reload: true }
    temsprotect.status:
        description: Has permission to use the status command
        default: op
        children: { coreprotect.status: true }
    temsprotect.consumer:
        description: Has permission to use the consumer command
        default: op
        children: { coreprotect.consumer: true }
    temsprotect.networking:
        description: Has permission to use the networking API
        default: op
        children: { coreprotect.networking: true }
    temsprotect.give:
        description: Has permission to use the give command
        default: false
        children: { coreprotect.give: true }
    temsprotect.migrate:
        description: Has permission to migrate the database backend
        default: op
        children: { coreprotect.migrate: true }
    coreprotect.*:
        description: Legacy alias for temsprotect.*
        default: op
        children:
            temsprotect.*: true
    coreprotect.co:
        description: Legacy alias for temsprotect.co
        default: true
        children: { temsprotect.co: true }
    coreprotect.core:
        description: Legacy alias for the /core command
        default: false
    coreprotect.coreprotect:
        description: Legacy alias for the /coreprotect command
