[versions]
paper = "26.3.build.262-stable"
fastasyncworldedit = "2.16.3"
advancedchests = "3.2-BETA"
hikari = "7.1.0"
duckdb = "2.0.1.0"
clickhouse = "0.11.2"
log4j = "2.26.1"
junit = "6.1.3"
mockito = "5.24.0"
mockbukkit = "3.133.2"
sqlite = "3.54.1.0"
mysql = "26.10.0"
slf4j = "2.0.20"
bytebuddy = "1.18.17"
shadow = "9.6.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
fastasyncworldedit-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fastasyncworldedit" }
fastasyncworldedit-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fastasyncworldedit" }
advancedchests = { module = "com.github.DeadSilenceIV:AdvancedChestsAPI", version.ref = "advancedchests" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
clickhouse-jdbc = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouse" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
mockbukkit = { module = "com.github.seeseemelk:MockBukkit-v1.21", version.ref = "mockbukkit" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
bytebuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "bytebuddy" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
