[versions]
paper = "26.3.build.262-stable"
fastasyncworldedit = "2.15.0"
advancedchests = "3.2-BETA"
hikari = "7.0.2"
duckdb = "1.4.5.0"
clickhouse = "0.10.0"
log4j = "2.25.5"
junit = "5.14.3"
shadow = "9.4.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
fastasyncworldedit-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fastasyncworldedit" }
fastasyncworldedit-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fastasyncworldedit" }
advancedchests = { module = "com.github.DeadSilenceIV:AdvancedChestsAPI", version.ref = "advancedchests" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
